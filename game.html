<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Income Club Calculator</title>
<style>
  body {
    /* Sky blue background */
    background-color: #87CEEB; 
    
    /* Pure CSS embedded SVG pattern for repeating money emoji */
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='40' y='60' font-size='40'%3E💸%3C/text%3E%3C/svg%3E");
    
    /* Animate the background to create a flying/floating effect */
    animation: floatMoney 8s linear infinite;
    
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
  }

  /* Seamless background scrolling */
  @keyframes floatMoney {
    0% { background-position: 0 0; }
    100% { background-position: 120px 120px; }
  }

  .calculator-card {
    background-color: #ffffff; /* Flipped to White */
    color: #111827; /* Dark text for readability */
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    /* Added a heavier shadow to make the white card pop against the busy background */
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); 
    position: relative;
    z-index: 10;
  }

  .header h2 {
    margin: 0 0 8px 0;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .header p {
    color: #6b7280;
    font-size: 0.95rem;
    margin: 0 0 24px 0;
  }

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #374151;
  }

  input[type="number"] {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db; /* Light gray border */
    background-color: #f9fafb; /* Very subtle off-white background */
    color: #111827;
    font-size: 1.1rem;
    margin-bottom: 24px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="number"]:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  .results {
    border-top: 1px solid #e5e7eb; /* Light border separator */
    padding-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .results span {
    color: #4b5563;
    font-size: 0.95rem;
    font-weight: 500;
  }

  .results strong {
    font-size: 1.35rem;
    font-weight: 700;
    transition: color 0.3s ease;
  }
</style>
</head>
<body>

<div class="calculator-card">
  <div class="header">
    <h2>How Rich 🤑 are you in 🇮🇳 ?</h2>
    <p>Find out where you stand in the hierarchy 🧐</p>
  </div>

  <label for="income">Annual Income (₹)</label>
  <input type="number" id="income" placeholder="Enter amount (e.g. 1500000)">

  <div class="results">
    <span>Your Percentile Club</span>
    <strong id="result-text" style="color: #9ca3af;">Enter Income</strong>
  </div>
</div>

<script>
  function calculateClub() {
    const income = parseFloat(document.getElementById('income').value);
    const resultEl = document.getElementById('result-text');

    if (isNaN(income) || income < 0) {
      resultEl.textContent = 'Enter Income';
      resultEl.style.color = '#9ca3af'; /* Default gray on white */
      return;
    }

    let club = "";
    let color = ""; 

    if (income >= 2200000) { club = "Top 1%"; color = "#10b981"; }
    else if (income >= 720000) { club = "Top 5%"; color = "#10b981"; }
    else if (income >= 360000) { club = "Top 10%"; color = "#10b981"; } 
    else if (income >= 240000) { club = "Top 15%"; color = "#f59e0b"; } 
    else if (income >= 200000) { club = "Top 20%"; color = "#f59e0b"; } 
    else if (income >= 180000) { club = "Top 30%"; color = "#f59e0b"; } 
    else if (income >= 165000) { club = "Top 40%"; color = "#f97316"; } 
    else if (income >= 150000) { club = "Mid 50%"; color = "#f97316"; } 
    else if (income >= 120000) { club = "Below 40%"; color = "#ea580c"; } 
    else if (income >= 96000)  { club = "Below 30%"; color = "#ea580c"; } 
    else if (income >= 72000)  { club = "Below 20%"; color = "#ef4444"; } 
    else if (income >= 48000)  { club = "Below 10%"; color = "#ef4444"; } 
    else { club = "0%"; color = "#b91c1c"; } 

    resultEl.textContent = club;
    resultEl.style.color = color;
  }

  document.getElementById('income').addEventListener('input', calculateClub);
</script>

</body>
</html>
