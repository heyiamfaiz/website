<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Income Club Calculator</title>
<style>
  body {
    background-color: #f8fafc; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .calculator-card {
    background-color: #111827; 
    color: #f9fafb;
    padding: 24px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }
  .header h2 {
    margin: 0 0 4px 0;
    font-size: 1.25rem;
    font-weight: 600;
  }
  .header p {
    color: #9ca3af;
    font-size: 0.875rem;
    margin: 0 0 24px 0;
  }
  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 8px;
    color: #e5e7eb;
  }
  input[type="number"] {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #374151;
    background-color: #1f2937;
    color: white;
    font-size: 1rem;
    margin-bottom: 24px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="number"]:focus {
    border-color: #6366f1;
  }
  .results {
    border-top: 1px solid #374151;
    padding-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .results span {
    color: #9ca3af;
    font-size: 0.875rem;
  }
  .results strong {
    font-size: 1.25rem;
    transition: color 0.3s ease;
  }
</style>
</head>
<body>

<div class="calculator-card">
  <div class="header">
    <h2>Income Club Calculator 🇮🇳</h2>
    <p>Find out where you stand in the hierarchy 🧐</p>
  </div>

  <label for="income">Annual Income (₹)</label>
  <input type="number" id="income" placeholder="Enter amount (e.g. 1500000)">

  <div class="results">
    <span>Your Percentile Club</span>
    <strong id="result-text" style="color: #9ca3af;">Enter Income</strong>
  </div>
</div>

<script>
  function calculateClub() {
    const income = parseFloat(document.getElementById('income').value);
    const resultEl = document.getElementById('result-text');

    if (isNaN(income) || income < 0) {
      resultEl.textContent = 'Enter Income';
      resultEl.style.color = '#9ca3af';
      return;
    }

    let club = "";
    let color = ""; 

    if (income >= 2200000) { club = "Top 1%"; color = "#10b981"; }
    else if (income >= 720000) { club = "Top 5%"; color = "#10b981"; }
    else if (income >= 360000) { club = "Top 10%"; color = "#10b981"; } // Moved to green for top 10%
    else if (income >= 240000) { club = "Top 15%"; color = "#f59e0b"; } // Yellow
    else if (income >= 200000) { club = "Top 20%"; color = "#f59e0b"; } // Interpolated value
    else if (income >= 180000) { club = "Top 30%"; color = "#f59e0b"; } // Interpolated value
    else if (income >= 165000) { club = "Top 40%"; color = "#f97316"; } // Orange
    else if (income >= 150000) { club = "Mid 50%"; color = "#f97316"; } // Orange
    else if (income >= 120000) { club = "Below 40%"; color = "#ea580c"; } // 60th percentile marker
    else if (income >= 96000)  { club = "Below 30%"; color = "#ea580c"; } // 70th percentile marker
    else if (income >= 72000)  { club = "Below 20%"; color = "#ef4444"; } // 80th percentile marker
    else if (income >= 48000)  { club = "Below 10%"; color = "#ef4444"; } // 90th percentile marker
    else { club = "0%"; color = "#b91c1c"; } // Deep Red for absolute bottom

    resultEl.textContent = club;
    resultEl.style.color = color;
  }

  document.getElementById('income').addEventListener('input', calculateClub);
</script>

</body>
</html>
