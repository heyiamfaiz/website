<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Income Club Calculator</title>
<style>
  body {
    background-color: #87CEEB; 
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='40' y='60' font-size='40'%3E💸%3C/text%3E%3C/svg%3E");
    animation: floatMoney 8s linear infinite;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
  }

  @keyframes floatMoney {
    0% { background-position: 0 0; }
    100% { background-position: 120px 120px; }
  }

  .calculator-card {
    background-color: #ffffff; 
    color: #111827; 
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); 
    position: relative;
    z-index: 10;
  }

  .header h2 {
    margin: 0 0 8px 0;
    font-size: 1.5rem;
    font-weight: 700;
  }

  .header p {
    color: #6b7280;
    font-size: 0.95rem;
    margin: 0 0 24px 0;
  }

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #374151;
  }

  input[type="number"] {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db; 
    background-color: #f9fafb; 
    color: #111827;
    font-size: 1.1rem;
    margin-bottom: 24px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="number"]:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  .results {
    border-top: 1px solid #e5e7eb; 
    padding-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .results span {
    color: #4b5563;
    font-size: 0.95rem;
    font-weight: 500;
  }

  .results strong {
    font-size: 1.35rem;
    font-weight: 700;
    transition: color 0.3s ease;
  }

  .meme-box {
    display: none;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .meme-box img {
    width: 100%;
    height: auto;
    display: block;
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="calculator-card">
  <div class="header">
    <h2>How Rich are you in 🇮🇳</h2>
    <p>Find out where you stand in the hierarchy 🧐</p>
  </div>

  <label for="income">Annual Income (₹)</label>
  <input type="number" id="income" placeholder="Enter amount (e.g. 1500000)">

  <div class="results">
    <span>Your Percentile Club</span>
    <strong id="result-text" style="color: #9ca3af;">Enter Income</strong>
  </div>

  <div id="meme-container" class="meme-box">
    <img id="meme-img" src="" alt="Reaction Meme">
  </div>
</div>

<script>
  function calculateClub() {
    const income = parseFloat(document.getElementById('income').value);
    const resultEl = document.getElementById('result-text');
    const memeContainer = document.getElementById('meme-container');
    const memeImg = document.getElementById('meme-img');

    if (isNaN(income) || income < 0) {
      resultEl.textContent = 'Enter Income';
      resultEl.style.color = '#9ca3af'; 
      memeContainer.style.display = 'none';
      return;
    }

    let club = "";
    let color = ""; 
    let memeUrl = "";

    // Calculate Percentile Data
    if (income >= 2200000) { club = "Top 1%"; color = "#10b981"; }
    else if (income >= 720000) { club = "Top 5%"; color = "#10b981"; }
    else if (income >= 360000) { club = "Top 10%"; color = "#10b981"; } 
    else if (income >= 240000) { club = "Top 15%"; color = "#f59e0b"; } 
    else if (income >= 200000) { club = "Top 20%"; color = "#f59e0b"; } 
    else if (income >= 180000) { club = "Top 30%"; color = "#f59e0b"; } 
    else if (income >= 165000) { club = "Top 40%"; color = "#f97316"; } 
    else if (income >= 150000) { club = "Mid 50%"; color = "#f97316"; } 
    else if (income >= 120000) { club = "Below 40%"; color = "#ea580c"; } 
    else if (income >= 96000)  { club = "Below 30%"; color = "#ea580c"; } 
    else if (income >= 72000)  { club = "Below 20%"; color = "#ef4444"; } 
    else if (income >= 48000)  { club = "Below 10%"; color = "#ef4444"; } 
    else { club = "0%"; color = "#b91c1c"; } 

    // Assign Meme Tier
    if (income >= 200000) {
      // Top 1% to 20%
      memeUrl = "https://placehold.co/400x250/10b981/ffffff?text=Chaand+Pe+Hai+Apun+🚀";
    } else if (income >= 150000) {
      // Top 30% to 50%
      memeUrl = "https://placehold.co/400x250/f97316/ffffff?text=Yeh+Bhi+Theek+Hai+🤷‍♂️";
    } else {
      // Below 40% to 0%
      memeUrl = "https://placehold.co/400x250/ef4444/ffffff?text=Humne+Gareebi+Dekhi+Hai+😭";
    }

    // Apply Updates
    resultEl.textContent = club;
    resultEl.style.color = color;
    memeImg.src = memeUrl;
    memeContainer.style.display = 'block';
  }

  document.getElementById('income').addEventListener('input', calculateClub);
</script>

</body>
</html>
